<h2 class="summary-title">Paiement de la commande #{{ orderId }}</h2>

<div class="summary-body">
  <p *ngIf="!selectedMethod" class="summary-info">
    Sélectionne une méthode de paiement à gauche pour continuer.
  </p>

  <div *ngIf="selectedMethod" class="summary-selected">
    <div class="summary-row">
      <span class="summary-label">Méthode sélectionnée :</span>
      <span class="summary-value">{{ selectedMethod }}</span>
    </div>

    <div class="summary-row">
      <span class="summary-label">Montant total :</span>
      <span class="summary-value">
        {{ totalAmount | number:'1.2-2' }} €
      </span>
    </div>

    <button
      type="button"
      class="summary-button"
      (click)="pay.emit()"
      [disabled]="isPaying || !canPay"
    >
      {{ isPaying ? 'Paiement en cours...' : 'Payer maintenant' }}
    </button>

    <p *ngIf="!canPay" class="summary-warning">
      Renseigne ton adresse de livraison pour pouvoir payer.
    </p>
  </div>
</div>
