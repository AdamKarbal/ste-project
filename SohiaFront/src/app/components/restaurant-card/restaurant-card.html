<div class="card">
  <img
    [src]="restaurant.image || 'https://via.placeholder.com/300x180?text=Restaurant'"
    [alt]="restaurant.name"
  />
  <div class="card-content">
    <h3>{{ restaurant.name }}</h3>
    <p class="type">{{ restaurant.establishmentType }}</p>
    <p class="cuisine">{{ restaurant.cuisineTypes.join(', ') }}</p>
  </div>
</div>
