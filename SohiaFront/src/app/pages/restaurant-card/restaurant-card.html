<div class="card" (click)="goToDetails()">
  <img [src]="'https://source.unsplash.com/400x300/?' + restaurant.cuisineTypes[0]" alt="{{ restaurant.name }}" />
  <div class="info">
    <h3>{{ restaurant.name }}</h3>
    <p>{{ restaurant.establishmentType }}</p>
    <p class="tags">{{ restaurant.cuisineTypes.join(', ') }}</p>
  </div>
</div>
