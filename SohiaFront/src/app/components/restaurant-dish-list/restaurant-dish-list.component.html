<div class="dish-list">
  <div class="dish-list-filters">
    <input
      type="text"
      class="dish-search-input"
      placeholder="Rechercher un plat..."
      [(ngModel)]="searchTerm"
    />

    <div class="dish-category-filters" *ngIf="categories.length > 0">
      <button
        type="button"
        class="category-chip"
        [class.category-chip--active]="selectedCategory === 'all'"
        (click)="onSelectCategory('all')"
      >
        Tous
      </button>

      <button
        type="button"
        class="category-chip"
        *ngFor="let cat of categories"
        [class.category-chip--active]="selectedCategory === cat"
        (click)="onSelectCategory(cat)"
      >
        {{ cat }}
      </button>
    </div>
  </div>

  <div class="dish-list-grid" *ngIf="filteredDishes.length > 0; else noDish">
    <se-restaurant-dish-card
      *ngFor="let dish of filteredDishes"
      [dish]="dish"
      (add)="onDishAdded(dish, $event)"
    >
    </se-restaurant-dish-card>
  </div>

  <ng-template #noDish>
    <div class="dish-empty-state">
      Aucun plat ne correspond à ta recherche.
    </div>
  </ng-template>
</div>
