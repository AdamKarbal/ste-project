<div class="dish-card">
  <div class="dish-header">
    <h3 class="dish-name">{{ dish.name }}</h3>

    <div class="dish-price">
      {{ formattedPrice }}
    </div>
  </div>

  <p class="dish-description" *ngIf="dish.description">
    {{ dish.description }}
  </p>

  <div class="dish-meta">
    <span class="meta-badge" *ngIf="dish.category">
      {{ dish.category }}
    </span>

    <span class="meta-badge meta-type" *ngIf="dish.type">
      {{ dish.type }}
    </span>

    <ng-container *ngIf="dish.dishTag?.length">
      <span
        class="tag-badge"
        *ngFor="let tag of dish.dishTag"
      >
        {{ tag }}
      </span>
    </ng-container>
  </div>

  <div class="dish-actions">
    <div class="quantity-selector">
      <button type="button" (click)="onDecrease()">−</button>
      <span class="quantity-value">{{ quantity }}</span>
      <button type="button" (click)="onIncrease()">+</button>
    </div>

    <button
      type="button"
      class="add-to-cart-btn"
      (click)="onAddToCart()"
    >
      Ajouter
    </button>
  </div>
</div>
