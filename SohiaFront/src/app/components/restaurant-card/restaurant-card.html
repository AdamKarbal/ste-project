<div class="card" (click)="goToDetails()">
  <img
    [src]="restaurant.image ? restaurant.image : './assets/base_restaurant.png'"
    [alt]="restaurant.name"
  />

  <div class="card-content">
    <h3>{{ restaurant.name }}</h3>
    <p class="type">{{ restaurant.establishmentType }}</p>
    <p class="cuisine">{{ restaurant.cuisineTypes.join(', ') }}</p>

    <div class="restaurant-card" *ngIf="isLoggedIn">
      <button class="order-btn" (click)="goToMenu()">Commander</button>
    </div>
  </div>
</div>
